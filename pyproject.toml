[project]
name = "hass-nhlapi"
version = "1.1.1"
description = "Track a single NHL team in Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.9.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff]
target-version = "py314"
